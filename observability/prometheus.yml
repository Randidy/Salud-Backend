global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['localhost:8001'] }]
  - job_name: 'auth-service'
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['localhost:8083'] }]
  - job_name: 'paciente-service'
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['localhost:8086'] }]
  - job_name: 'medico-service'
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['localhost:8082'] }]
  - job_name: 'medicamentos-service'
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['localhost:8081'] }]
  - job_name: 'cita-service'
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['localhost:8010'] }]
  - job_name: 'reportes-service'
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['localhost:8090'] }]
  - job_name: 'notificaciones-service'
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['localhost:8089'] }]
